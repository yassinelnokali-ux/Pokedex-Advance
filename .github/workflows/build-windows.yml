name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name PokedexAdvance pokedex.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: PokedexAdvance-Windows
          path: dist/PokedexAdvance.exe
